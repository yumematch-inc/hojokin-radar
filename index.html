<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>補助金・助成金レーダー</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #eef2f7;
  --card:     #ffffff;
  --border:   #dde4ee;
  --text:     #0d1b2e;
  --sub:      #2d4059;
  --muted:    #6b7a99;
  --blue:     #1a56db;
  --blue-bg:  #ebf3ff;
  --red:      #c81e1e;
  --red-bg:   #fef2f2;
  --orange:   #c05621;
  --orange-bg:#fff5eb;
  --green:    #0d7a4b;
  --green-bg: #edfaf4;
  --shadow-sm: 0 1px 3px rgba(13,27,46,.07), 0 1px 2px rgba(13,27,46,.04);
  --shadow-md: 0 4px 16px rgba(13,27,46,.1),  0 2px 4px rgba(13,27,46,.06);
  --shadow-lg: 0 12px 32px rgba(13,27,46,.13), 0 4px 8px rgba(13,27,46,.07);
}

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ══════════════════════════════════════
   HERO
══════════════════════════════════════ */
.hero {
  background: linear-gradient(135deg, #0a2447 0%, #0f3576 45%, #1a56db 100%);
  padding: 36px 5% 32px;
  color: #fff;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.025'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
}

.hero-inner { position: relative; z-index: 1; }

.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.hero-badge {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .04em;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 0 rgba(74,222,128,.4); animation: ping 2s infinite; }
@keyframes ping { 0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.4)} 50%{box-shadow:0 0 0 6px rgba(74,222,128,0)} }

.hero h1 { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.2; margin-bottom: 8px; }
.hero-sub { font-size: .85rem; color: rgba(255,255,255,.7); margin-bottom: 24px; max-width: 560px; }
.hero-meta { font-size: .72rem; color: rgba(255,255,255,.5); }

.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 24px;
}
.hero-stat {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 12px;
  padding: 14px 16px;
  backdrop-filter: blur(8px);
}
.hero-stat-label { font-size: .7rem; color: rgba(255,255,255,.6); margin-bottom: 4px; }
.hero-stat-val { font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; }
.hero-stat-sub { font-size: .68rem; color: rgba(255,255,255,.5); margin-top: 2px; }

/* ══════════════════════════════════════
   FILTER BAR (sticky)
══════════════════════════════════════ */
.filter-wrap {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 0 5%;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(13,27,46,.06);
}
.filter-inner {
  display: flex;
  align-items: center;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.filter-inner::-webkit-scrollbar { display: none; }

.filter-group {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 0;
  flex-shrink: 0;
}
.filter-divider {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 12px;
  flex-shrink: 0;
}
.filter-group-label {
  font-size: .68rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-right: 6px;
  white-space: nowrap;
}
.fbtn {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--muted);
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-size: .78rem;
  font-family: inherit;
  white-space: nowrap;
  transition: all .15s;
  font-weight: 500;
}
.fbtn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }
.fbtn.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }

/* ══════════════════════════════════════
   GRID
══════════════════════════════════════ */
.grid-wrap { padding: 24px 5%; }
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 18px;
}

/* ══════════════════════════════════════
   CARD
══════════════════════════════════════ */
.card {
  background: var(--card);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: box-shadow .2s, transform .2s;
  display: flex;
  flex-direction: column;
}
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

/* left accent bar */
.card-accent { width: 4px; flex-shrink: 0; }
.card-row { display: flex; flex: 1; }

.acc-urgent  { background: var(--red); }
.acc-warning { background: var(--orange); }
.acc-normal  { background: var(--green); }
.acc-ongoing { background: var(--blue); }
.acc-closed  { background: #cbd5e1; }

.card-body { padding: 18px 20px 0; flex: 1; display: flex; flex-direction: column; }

/* tags + badge */
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  font-size: .65rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: .02em;
  white-space: nowrap;
}
.t-hana   { background: #f5f3ff; color: #6d28d9; border: 1px solid #ddd6fe; }
.t-pharma { background: #ecfeff; color: #0e7490; border: 1px solid #a5f3fc; }
.t-fp     { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.t-all    { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
.t-it     { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
.t-emp    { background: #fdf4ff; color: #86198f; border: 1px solid #f0abfc; }
.t-sale   { background: #fefce8; color: #854d0e; border: 1px solid #fde047; }
.t-fac    { background: #f0fdfa; color: #115e59; border: 1px solid #99f6e4; }
.t-nag    { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; }
.t-zai    { background: #f8fafc; color: #475569; border: 1px solid #cbd5e1; }

/* urgency badge */
.ubadge {
  flex-shrink: 0;
  font-size: .68rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 6px;
  white-space: nowrap;
}
.ub-urgent  { background: var(--red-bg);    color: var(--red);    border: 1px solid #fca5a5; }
.ub-warning { background: var(--orange-bg); color: var(--orange); border: 1px solid #fdba74; }
.ub-normal  { background: var(--green-bg);  color: var(--green);  border: 1px solid #6ee7b7; }
.ub-ongoing { background: var(--blue-bg);   color: var(--blue);   border: 1px solid #93c5fd; }
.ub-closed  { background: #f1f5f9; color: var(--muted); border: 1px solid #cbd5e1; }

/* title */
.card-title { font-size: .98rem; font-weight: 800; line-height: 1.3; letter-spacing: -.02em; }
.card-sub   { font-size: .72rem; color: var(--muted); margin-top: 2px; }

/* amount */
.amount-row { margin: 12px 0 2px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.amount     { font-size: 1.35rem; font-weight: 900; color: var(--blue); letter-spacing: -.03em; }
.rate-note  { font-size: .75rem; color: var(--muted); }

/* meta row: difficulty + effort */
.meta-row { display: flex; align-items: center; gap: 14px; margin: 8px 0 10px; }
.meta-item { display: flex; align-items: center; gap: 4px; font-size: .72rem; color: var(--muted); }
.stars { letter-spacing: -.1em; }
.star-filled  { color: #f59e0b; }
.star-empty   { color: #d1d5db; }

/* desc */
.card-desc { font-size: .82rem; color: var(--sub); line-height: 1.65; margin-bottom: 10px; }

/* point box */
.point-box {
  background: #fffbeb;
  border-left: 3px solid #f59e0b;
  border-radius: 0 8px 8px 0;
  padding: 8px 12px;
  font-size: .77rem;
  color: #78350f;
  line-height: 1.55;
  margin-bottom: 12px;
}
.point-box strong { color: #92400e; }

/* deadline row */
.deadline-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  font-size: .78rem;
  flex-wrap: wrap;
}
.dl-label { color: var(--muted); }
.dl-val   { font-weight: 700; color: var(--sub); }
.dl-days  {
  margin-left: auto;
  font-size: .72rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 5px;
}
.days-urgent  { background: var(--red-bg);    color: var(--red); }
.days-warning { background: var(--orange-bg); color: var(--orange); }
.days-normal  { background: var(--green-bg);  color: var(--green); }
.days-ongoing { background: var(--blue-bg);   color: var(--blue); }
.days-closed  { background: #f1f5f9; color: var(--muted); }

/* expand button */
.expand-btn {
  width: 100%;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 14px;
  text-align: left;
  cursor: pointer;
  font-size: .78rem;
  font-weight: 600;
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background .12s;
  font-family: inherit;
  margin-bottom: 0;
}
.expand-btn:hover { background: #eef2f7; }
.expand-btn.open  { background: #eef2f7; border-color: var(--blue); color: var(--blue); border-radius: 8px 8px 0 0; }
.expand-arrow { font-size: .65rem; transition: transform .2s; }
.expand-btn.open .expand-arrow { transform: rotate(180deg); }

/* expanded detail */
.card-detail {
  display: none;
  border: 1px solid var(--blue);
  border-top: none;
  border-radius: 0 0 8px 8px;
  overflow: hidden;
  margin-bottom: 0;
}
.card-detail.open { display: block; }

.detail-sec { padding: 12px 14px; background: #fff; }
.detail-sec + .detail-sec { border-top: 1px solid var(--border); }
.detail-head {
  font-size: .68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.doc-list { list-style: none; }
.doc-list li {
  font-size: .78rem;
  color: var(--sub);
  padding: 3px 0;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.doc-list li::before { content: '□'; color: var(--blue); font-size: .8rem; flex-shrink: 0; }
.step-list { list-style: none; counter-reset: step; }
.step-list li {
  font-size: .78rem;
  color: var(--sub);
  padding: 3px 0;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.snum {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--blue);
  color: #fff;
  font-size: .62rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.detail-note {
  font-size: .75rem;
  color: #7c2d12;
  background: #fff7ed;
  border-radius: 6px;
  padding: 8px 10px;
  line-height: 1.55;
}
.detail-note::before { content: '⚠ '; font-weight: 700; }

/* card footer */
.card-foot {
  padding: 12px 20px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--border);
  margin-top: 14px;
}
.card-link {
  color: var(--blue);
  text-decoration: none;
  font-size: .78rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 3px;
}
.card-link:hover { text-decoration: underline; }
.card-id { font-size: .68rem; color: #c9d4e8; }

/* ══════════════════════════════════════
   EMPTY STATE
══════════════════════════════════════ */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 64px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
.empty p { font-size: .9rem; }

/* ══════════════════════════════════════
   FOOTER
══════════════════════════════════════ */
.foot {
  text-align: center;
  padding: 24px 5% 32px;
  font-size: .72rem;
  color: #b0bdd4;
}
.foot a { color: var(--blue); text-decoration: none; }
.foot a:hover { text-decoration: underline; }

/* ══════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════ */
@media (max-width: 900px) {
  .hero-stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .hero { padding: 24px 4% 20px; }
  .hero-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .hero-stat { padding: 10px 12px; }
  .hero-stat-val { font-size: 1.25rem; }
  .filter-wrap { padding: 0 4%; }
  .grid-wrap { padding: 16px 4%; }
  .cards-grid { grid-template-columns: 1fr; gap: 14px; }
  .card-body { padding: 14px 16px 0; }
  .card-foot { padding: 10px 16px 12px; }
}
</style>
</head>

/* ─── UTILS ─── */
function daysLeft(s){ if(!s)return null; return Math.ceil((new Date(s)-TODAY)/86400000); }
function urgency(d){
  if(d===null)return'ongoing';
  if(d<=0)return'closed';
  if(d<=30)return'urgent';
  if(d<=60)return'warning';
  return'normal';
}
const ACC  = {urgent:'acc-urgent',warning:'acc-warning',normal:'acc-normal',ongoing:'acc-ongoing',closed:'acc-closed'};
const UB   = {urgent:'ub-urgent', warning:'ub-warning', normal:'ub-normal', ongoing:'ub-ongoing', closed:'ub-closed'};
const DAYS_CLS = {urgent:'days-urgent',warning:'days-warning',normal:'days-normal',ongoing:'days-ongoing',closed:'days-closed'};
function badgeText(urg,d){
  if(urg==='ongoing')return '通年申請';
  if(urg==='closed') return '締切済';
  return `残 ${d}日`;
}
function starsHtml(n){
  return Array.from({length:5},(_,i)=>
    `<span class="${i<n?'star-filled':'star-empty'}">★</span>`
  ).join('');
}

/* ─── FILTER STATE ─── */
let active = 'all';

function match(g){
  if(active==='all') return true;
  if(active.startsWith('biz-')) return g.businesses.includes(active.slice(4));
  if(active.startsWith('cat-')) return g.categories.includes(active.slice(4));
  return true;
}

/* ─── RENDER ─── */
function render(){
  const list = GRANTS.filter(match);
  document.getElementById('stat-total').textContent = list.length;
  const urg60 = list.filter(g=>{ const d=daysLeft(g.deadline); return d!==null&&d>0&&d<=60; }).length;
  document.getElementById('stat-urgent').textContent = urg60;

  const grid = document.getElementById('grid');
  if(!list.length){
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>該当する補助金がありません</p></div>`;
    return;
  }

  grid.innerHTML = list.map(g=>{
    const d   = daysLeft(g.deadline);
    const urg = urgency(d);

    const bizTags = g.businesses.map(b=>{
      const v=BIZ[b]||{cls:'t-all',label:b};
      return `<span class="tag ${v.cls}">${v.label}</span>`;
    }).join('');
    const catTags = g.categories.map(c=>{
      const v=CAT[c]||{cls:'t-zai',label:c};
      return `<span class="tag ${v.cls}">${v.label}</span>`;
    }).join('');

    const daysHtml = urg==='ongoing'
      ? `<span class="dl-days days-ongoing">通年申請可</span>`
      : urg==='closed'
      ? `<span class="dl-days days-closed">締切済</span>`
      : `<span class="dl-days ${DAYS_CLS[urg]}">残 ${d}日</span>`;

    const docsHtml = g.docs.map(doc=>`<li>${doc}</li>`).join('');
    const stepsHtml = g.steps.map((s,i)=>
      `<li><span class="snum">${i+1}</span>${s}</li>`
    ).join('');

    return `
<div class="card">
  <div class="card-row">
    <div class="card-accent ${ACC[urg]}"></div>
    <div class="card-body">
      <div class="card-top">
        <div class="card-tags">${bizTags}${catTags}</div>
        <span class="ubadge ${UB[urg]}">${badgeText(urg,d)}</span>
      </div>
      <div class="card-title">${g.title}</div>
      <div class="card-sub">${g.subtitle}</div>
      <div class="amount-row">
        <span class="amount">${g.amount}</span>
      </div>
      <div class="rate-note">${g.rate}</div>
      <div class="meta-row">
        <div class="meta-item"><span class="stars">${starsHtml(g.difficulty)}</span><span>難易度</span></div>
        <div class="meta-item">⏱ 目安 ${g.effort}</div>
      </div>
      <div class="card-desc">${g.desc}</div>
      <div class="point-box">💡 ${g.point}</div>
      <div class="deadline-row">
        <span class="dl-label">📅 締切</span>
        <span class="dl-val">${g.deadlineLabel}</span>
        ${daysHtml}
      </div>
      <button class="expand-btn" onclick="toggle(${g.id},this)">
        <span class="expand-label">📋 必要書類・申請手順を見る</span>
        <span class="expand-arrow">▼</span>
      </button>
      <div class="card-detail" id="det-${g.id}">
        <div class="detail-sec">
          <div class="detail-head">📄 必要書類</div>
          <ul class="doc-list">${docsHtml}</ul>
        </div>
        <div class="detail-sec">
          <div class="detail-head">✅ 申請ステップ</div>
          <ul class="step-list">${stepsHtml}</ul>
        </div>
        ${g.note?`<div class="detail-sec"><div class="detail-note">${g.note}</div></div>`:''}
      </div>
    </div>
  </div>
  <div class="card-foot">
    <a class="card-link" href="${g.url}" target="_blank" rel="noopener">公式サイトで確認 →</a>
    <span class="card-id">#${g.id}</span>
  </div>
</div>`;
  }).join('');
}

function toggle(id, btn){
  const det = document.getElementById('det-'+id);
  const open = det.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.querySelector('.expand-label').textContent = open ? '📋 閉じる' : '📋 必要書類・申請手順を見る';
}

/* ─── FILTER BUTTONS ─── */
document.querySelectorAll('.fbtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    active = b.dataset.f;
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    render();
  });
});

render();
</script>
</body>
</html>
