<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>補助金・助成金レーダー</title>
<style>
:root {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --surface2: #f8fafc;
  --border: #dde3ec;
  --border2: #c8d2e0;
  --text: #0f172a;
  --sub: #334155;
  --muted: #64748b;
  --accent: #1d4ed8;
  --accent-light: #eff6ff;
  --red: #dc2626;
  --red-light: #fef2f2;
  --orange: #c2410c;
  --orange-light: #fff7ed;
  --green: #15803d;
  --green-light: #f0fdf4;
  --yellow: #92400e;
  --yellow-light: #fffbeb;
  --purple: #6d28d9;
  --purple-light: #f5f3ff;
  --cyan: #0e7490;
  --pink: #be185d;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* ─── HEADER ─── */
.header {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #1d4ed8, #7c3aed);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.header h1 { font-size: 1rem; font-weight: 700; letter-spacing: -.02em; }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.header-date { font-size: .72rem; color: var(--muted); }
.header-note { font-size: .68rem; color: var(--orange); font-weight: 500; }

/* ─── UPDATE BANNER ─── */
.update-banner {
  background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
  border-bottom: 1px solid var(--border);
  padding: 8px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  font-size: .75rem;
}
.update-info { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.update-item { display: flex; align-items: center; gap: 5px; color: var(--muted); }
.update-item strong { color: var(--sub); }
.update-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }
.update-dot.pulse {
  animation: pulse 2s infinite;
  box-shadow: 0 0 0 0 rgba(21,128,61,.4);
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(21,128,61,.4); }
  70%  { box-shadow: 0 0 0 6px rgba(21,128,61,0); }
  100% { box-shadow: 0 0 0 0 rgba(21,128,61,0); }
}

/* ─── CONTAINER ─── */
.container { max-width: 1280px; margin: 0 auto; padding: 20px 24px; }

/* ─── STATS ─── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}
.stat-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-label { font-size: .72rem; color: var(--muted); }
.stat-value { font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; }
.stat-sub { font-size: .7rem; color: var(--muted); }

/* ─── FILTERS ─── */
.filter-wrap {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 18px;
}
.filter-section + .filter-section { margin-top: 8px; }
.filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-group-label {
  font-size: .7rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .05em;
  min-width: 56px;
}
.filter-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 4px 12px;
  border-radius: 16px;
  cursor: pointer;
  font-size: .78rem;
  transition: all .15s;
  font-family: inherit;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active {
  background: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}

/* ─── CARDS ─── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 16px;
}

.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: box-shadow .15s, transform .15s;
}
.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); transform: translateY(-1px); }

.card-stripe { height: 4px; }
.stripe-urgent  { background: var(--red); }
.stripe-warning { background: var(--orange); }
.stripe-normal  { background: var(--green); }
.stripe-ongoing { background: var(--accent); }
.stripe-closed  { background: #cbd5e1; }

.card-body { padding: 16px 18px; }

/* Tags row */
.card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.tag {
  font-size: .67rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: .01em;
}
.t-hanahiraku { background: #f5f3ff; color: var(--purple); border: 1px solid #ddd6fe; }
.t-pharma     { background: #ecfeff; color: var(--cyan);   border: 1px solid #a5f3fc; }
.t-fp         { background: #f0fdf4; color: var(--green);  border: 1px solid #bbf7d0; }
.t-all        { background: #eff6ff; color: var(--accent); border: 1px solid #bfdbfe; }
.t-it         { background: #fff7ed; color: var(--orange); border: 1px solid #fed7aa; }
.t-employment { background: #fdf4ff; color: var(--pink);   border: 1px solid #f5d0fe; }
.t-sales      { background: #fffbeb; color: var(--yellow); border: 1px solid #fde68a; }
.t-facility   { background: #f0fdfa; color: #0f766e;       border: 1px solid #99f6e4; }
.t-nagano     { background: #fff1f2; color: #be123c;       border: 1px solid #fecdd3; }

/* Card header */
.card-header2 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
.card-title { font-size: .95rem; font-weight: 700; line-height: 1.35; }
.card-subtitle { font-size: .72rem; color: var(--muted); margin-top: 2px; }

.urgency-badge {
  flex-shrink: 0;
  font-size: .68rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 5px;
  white-space: nowrap;
}
.ub-urgent  { background: var(--red-light);    color: var(--red);    border: 1px solid #fca5a5; }
.ub-warning { background: var(--orange-light); color: var(--orange); border: 1px solid #fdba74; }
.ub-normal  { background: var(--green-light);  color: var(--green);  border: 1px solid #86efac; }
.ub-ongoing { background: var(--accent-light); color: var(--accent); border: 1px solid #93c5fd; }
.ub-closed  { background: #f1f5f9; color: var(--muted); border: 1px solid #cbd5e1; }

/* Amount */
.card-amount-row { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 4px; }
.card-amount { font-size: 1.3rem; font-weight: 800; color: #1d4ed8; letter-spacing: -.02em; }
.card-rate   { font-size: .75rem; color: var(--muted); }

/* Meta row (difficulty, effort) */
.card-meta-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.meta-item { display: flex; align-items: center; gap: 4px; font-size: .73rem; color: var(--muted); }
.stars { color: #f59e0b; letter-spacing: -.05em; }

.card-desc { font-size: .82rem; color: var(--sub); line-height: 1.65; margin-bottom: 10px; }

/* Point box */
.point-box {
  background: #fffbeb;
  border-left: 3px solid #f59e0b;
  border-radius: 0 6px 6px 0;
  padding: 7px 10px;
  font-size: .77rem;
  color: #78350f;
  line-height: 1.5;
  margin-bottom: 10px;
}

/* Deadline row */
.deadline-row { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); margin-bottom: 12px; }
.deadline-val { font-weight: 600; color: var(--sub); }
.deadline-days { font-weight: 700; }
.days-urgent  { color: var(--red); }
.days-warning { color: var(--orange); }
.days-normal  { color: var(--green); }
.days-ongoing { color: var(--accent); }

/* Expand toggle */
.expand-btn {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 12px;
  text-align: left;
  cursor: pointer;
  font-size: .78rem;
  font-weight: 600;
  color: var(--sub);
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background .1s;
  font-family: inherit;
  margin-bottom: 0;
}
.expand-btn:hover { background: var(--border); }
.expand-arrow { transition: transform .2s; font-size: .7rem; }
.expand-btn.open .expand-arrow { transform: rotate(180deg); }

/* Expanded detail */
.card-detail {
  display: none;
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.card-detail.open { display: block; }

.detail-section { padding: 12px 14px; }
.detail-section + .detail-section { border-top: 1px solid var(--border); }
.detail-title {
  font-size: .72rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 8px;
}
.doc-list, .step-list { list-style: none; }
.doc-list li {
  font-size: .78rem;
  color: var(--sub);
  padding: 3px 0;
  display: flex;
  align-items: baseline;
  gap: 7px;
}
.doc-list li::before { content: '□'; color: var(--accent); flex-shrink: 0; font-size: .8rem; }
.step-list li {
  font-size: .78rem;
  color: var(--sub);
  padding: 3px 0;
  display: flex;
  align-items: baseline;
  gap: 8px;
  counter-increment: step;
}
.step-num {
  background: var(--accent);
  color: #fff;
  border-radius: 50%;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .65rem;
  font-weight: 700;
}
.detail-note {
  font-size: .75rem;
  color: #7c2d12;
  background: #fff7ed;
  border-radius: 5px;
  padding: 7px 10px;
  margin-top: 8px;
  line-height: 1.5;
}
.detail-note::before { content: '⚠ '; }

/* Card footer */
.card-footer2 {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 18px 14px;
  border-top: 1px solid var(--border);
  margin-top: 10px;
}
.card-link {
  color: var(--accent);
  font-size: .78rem;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 3px;
  font-weight: 600;
}
.card-link:hover { text-decoration: underline; }

/* Responsive */
@media (max-width: 768px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .cards-grid { grid-template-columns: 1fr; }
  .container { padding: 14px 16px; }
  .update-banner { flex-direction: column; align-items: flex-start; }
}
</style>
</head>

function daysUntil(s) {
  if (!s) return null;
  return Math.ceil((new Date(s) - TODAY) / 86400000);
}
function getUrg(days) {
  if (days === null) return 'ongoing';
  if (days <= 0)  return 'closed';
  if (days <= 30) return 'urgent';
  if (days <= 60) return 'warning';
  return 'normal';
}
const UB_CLS = { urgent:'ub-urgent', warning:'ub-warning', normal:'ub-normal', ongoing:'ub-ongoing', closed:'ub-closed' };
const STRIPE  = { urgent:'stripe-urgent', warning:'stripe-warning', normal:'stripe-normal', ongoing:'stripe-ongoing', closed:'stripe-closed' };
const DAYS_CLS = { urgent:'days-urgent', warning:'days-warning', normal:'days-normal', ongoing:'days-ongoing', closed:'days-ongoing' };

function badgeText(urg, days) {
  if (urg === 'ongoing') return '通年申請';
  if (urg === 'closed')  return '締切済';
  return `残 ${days}日`;
}
function stars(n) {
  return '★'.repeat(n) + '☆'.repeat(5-n);
}

let activeFilter = 'all';
function match(g) {
  if (activeFilter === 'all') return true;
  if (activeFilter.startsWith('biz-')) return g.businesses.includes(activeFilter.replace('biz-',''));
  if (activeFilter.startsWith('cat-')) return g.categories.includes(activeFilter.replace('cat-',''));
  return true;
}

function render() {
  const filtered = GRANTS.filter(match);
  document.getElementById('stat-total').textContent = filtered.length;
  const urgCnt = filtered.filter(g => {
    const d = daysUntil(g.deadline);
    return d !== null && d > 0 && d <= 60;
  }).length;
  document.getElementById('stat-urgent').textContent = urgCnt;

  document.getElementById('cards-grid').innerHTML = filtered.map(g => {
    const days = daysUntil(g.deadline);
    const urg  = getUrg(days);

    const bizTags = g.businesses.map(b => {
      const v = BIZ[b] || { cls:'t-all', label: b };
      return `<span class="tag ${v.cls}">${v.label}</span>`;
    }).join('');
    const catTags = g.categories.map(c => {
      const v = CAT[c] || { cls:'t-all', label: c };
      return `<span class="tag ${v.cls}">${v.label}</span>`;
    }).join('');

    const daysHtml = urg === 'ongoing' ? `<span class="${DAYS_CLS[urg]} days-ongoing">通年申請可</span>`
      : urg === 'closed' ? `<span class="days-closed">締切済</span>`
      : `<span class="${DAYS_CLS[urg]}">${days > 0 ? `残 ${days}日` : '締切済'}</span>`;

    const docItems = g.docs.map(d => `<li>${d}</li>`).join('');
    const stepItems = g.steps.map((s, i) =>
      `<li><span class="step-num">${i+1}</span>${s}</li>`
    ).join('');

    return `
<div class="card" id="card-${g.id}">
  <div class="card-stripe ${STRIPE[urg]}"></div>
  <div class="card-body">
    <div class="card-tags">${bizTags}${catTags}</div>
    <div class="card-header2">
      <div class="card-title-block">
        <div class="card-title">${g.title}</div>
        <div class="card-subtitle">${g.subtitle}</div>
      </div>
      <span class="urgency-badge ${UB_CLS[urg]}">${badgeText(urg, days)}</span>
    </div>
    <div class="card-amount-row">
      <span class="card-amount">${g.amount}</span>
    </div>
    <div class="card-rate">${g.rate}</div>
    <div class="card-meta-row">
      <div class="meta-item">
        <span class="stars">${stars(g.difficulty)}</span>
        <span>申請難易度</span>
      </div>
      <div class="meta-item">⏱ 目安 ${g.effort}</div>
    </div>
    <div class="card-desc">${g.desc}</div>
    <div class="point-box">💡 ${g.point}</div>
    <div class="deadline-row">
      📅 締切：<span class="deadline-val">${g.deadlineLabel}</span>
      　${daysHtml}
    </div>
    <button class="expand-btn" onclick="toggleDetail(${g.id}, this)">
      <span>📋 必要書類・申請手順を見る</span>
      <span class="expand-arrow">▼</span>
    </button>
    <div class="card-detail" id="detail-${g.id}">
      <div class="detail-section">
        <div class="detail-title">必要書類</div>
        <ul class="doc-list">${docItems}</ul>
      </div>
      <div class="detail-section">
        <div class="detail-title">申請ステップ</div>
        <ul class="step-list">${stepItems}</ul>
      </div>
      ${g.note ? `<div class="detail-section"><div class="detail-note">${g.note}</div></div>` : ''}
    </div>
  </div>
  <div class="card-footer2">
    <a class="card-link" href="${g.url}" target="_blank" rel="noopener">公式サイトで確認 →</a>
    <span style="font-size:.72rem; color:var(--muted)">ID: ${g.id}</span>
  </div>
</div>`;
  }).join('');
}

function toggleDetail(id, btn) {
  const el = document.getElementById('detail-' + id);
  const open = el.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.querySelector('span:first-child').textContent = open ? '📋 閉じる' : '📋 必要書類・申請手順を見る';
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

render();
</script>
</body>
</html>
